<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Journal</title>
<style>
  :root {
    --paper: #F5F1E6;
    --paper-line: #E6DFCB;
    --margin-red: #A63D40;
    --ink: #2B2A28;
    --ink-soft: #6b6558;
    --indigo: #3B4A6B;
    --indigo-soft: #5c6d92;
    --done-green: #4d6b4f;
    --card: #FBF8F0;
    --shadow: rgba(43, 42, 40, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 32px;
    background-position: 0 78px;
  }

  .margin-line {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 72px;
    width: 1px;
    background: var(--margin-red);
    opacity: 0.35;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 20px 32px 14px 88px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-bottom: 1px solid var(--paper-line);
  }

  header h1 {
    font-family: 'Courier New', Courier, monospace;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }

  header .date-today {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .home-link {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--paper-line);
    color: var(--indigo);
    font-size: 16px;
    flex-shrink: 0;
  }
  .home-link:hover {
    background: var(--paper-line);
  }

  .logout-link {
    all: unset;
    cursor: pointer;
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: auto;
    align-self: center;
  }
  .logout-link:hover { color: var(--margin-red); }

  .login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    z-index: 10;
  }

  .login-card {
    background: var(--card);
    border-radius: 6px;
    box-shadow: 0 4px 20px var(--shadow);
    padding: 32px 30px;
    width: 320px;
    text-align: center;
  }

  .login-card h1 {
    font-family: 'Courier New', Courier, monospace;
    font-size: 18px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }

  .login-card p {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px 0;
  }

  .login-card input {
    width: 100%;
    margin-bottom: 10px;
  }

  .login-card .btn {
    width: 100%;
    margin-top: 6px;
  }

  .login-error {
    font-size: 12px;
    color: var(--margin-red);
    margin-top: 12px;
    min-height: 14px;
  }

  .layout {
    position: relative;
    z-index: 1;
    display: flex;
    min-height: calc(100vh - 62px);
  }

  nav {
    width: 210px;
    padding: 24px 12px 24px 76px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  nav button {
    all: unset;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 9px 12px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    transition: background 0.15s ease;
  }

  nav button .sym {
    color: var(--indigo);
    font-size: 15px;
    width: 14px;
    text-align: center;
  }

  nav button:hover { background: var(--paper-line); }
  nav button.active { background: var(--card); box-shadow: 0 1px 3px var(--shadow); }
  nav button.active .sym { color: var(--margin-red); }

  main {
    flex: 1;
    padding: 28px 40px 60px 24px;
    max-width: 760px;
  }

  .panel-title {
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--indigo);
    margin: 0 0 18px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-line);
  }

  .card {
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 1px 4px var(--shadow);
    padding: 20px 22px;
    margin-bottom: 20px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .type-toggle {
    display: flex;
    gap: 6px;
  }

  .type-toggle button {
    all: unset;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    color: var(--ink-soft);
  }

  .type-toggle button.selected {
    background: var(--indigo);
    color: var(--paper);
    border-color: var(--indigo);
  }

  input[type=text], input[type=date] {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    flex: 1;
    min-width: 180px;
  }

  input[type=text]:focus, input[type=date]:focus {
    outline: 2px solid var(--indigo-soft);
    outline-offset: 1px;
  }

  .btn {
    all: unset;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    padding: 9px 16px;
    background: var(--indigo);
    color: var(--paper);
    border-radius: 3px;
    text-align: center;
  }
  .btn:hover { background: var(--indigo-soft); }
  .btn:focus-visible { outline: 2px solid var(--margin-red); outline-offset: 2px; }

  .btn.subtle {
    background: transparent;
    color: var(--indigo);
    border: 1px solid var(--indigo);
  }

  ul.entry-list { list-style: none; margin: 0; padding: 0; }

  li.entry {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--paper-line);
    font-size: 15px;
  }
  li.entry:last-child { border-bottom: none; }

  .entry-symbol {
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    width: 18px;
    text-align: center;
    color: var(--indigo);
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .entry-symbol.done { color: var(--done-green); }
  .entry-symbol.migrated { color: var(--margin-red); }

  .entry-text { flex: 1; line-height: 1.5; }
  .entry-text.done-text { text-decoration: line-through; color: var(--ink-soft); }

  .entry-meta {
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    white-space: nowrap;
  }

  .entry-del {
    all: unset;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 2px 6px;
  }
  .entry-del:hover { color: var(--margin-red); }

  .empty-state {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 14px;
    padding: 6px 4px;
  }

  .collection-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .collection-tab {
    all: unset;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 12px;
    border: 1px solid var(--paper-line);
    color: var(--ink-soft);
  }
  .collection-tab.active {
    background: var(--indigo);
    color: var(--paper);
    border-color: var(--indigo);
  }

  .migrate-banner {
    background: #f2e2c8;
    border: 1px solid #d8bf8f;
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .index-block { margin-bottom: 18px; }
  .index-block h3 {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: var(--indigo);
    margin: 0 0 8px 0;
  }
  .index-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 4px;
    border-bottom: 1px dashed var(--paper-line);
    cursor: pointer;
  }
  .index-row:hover { color: var(--indigo); }

  .legend {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 700px) {
    .margin-line { left: 16px; }
    header { padding-left: 32px; }
    nav { padding-left: 24px; width: 160px; }
    main { padding-left: 12px; padding-right: 16px; }
  }
</style>
</head>
<body>

<div class="margin-line"></div>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Bullet Journal</h1>
    <p>Sign in to access your journal</p>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" id="loginBtn">Log In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appContainer" style="display:none;">
  <header>
    <a class="home-link" href="index.html" title="Back to workspace">&#8962;</a>
    <h1>Bullet Journal</h1>
    <span class="date-today" id="headerDate"></span>
    <button class="logout-link" id="logoutBtn">Log out</button>
  </header>

  <div class="layout">
    <nav id="nav">
      <button data-view="today" class="active"><span class="sym">•</span> Today</button>
      <button data-view="capture"><span class="sym">+</span> Quick Capture</button>
      <button data-view="browse"><span class="sym">○</span> Browse Dates</button>
      <button data-view="migrate"><span class="sym">></span> Migrate</button>
      <button data-view="collections"><span class="sym">–</span> Collections</button>
      <button data-view="index"><span class="sym">≡</span> Index</button>
      <button data-view="search"><span class="sym">?</span> Search</button>
    </nav>

    <main id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ---------- Supabase ----------
  const SUPABASE_URL = 'https://nkfflkrlpulujmgdxxcg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8YxOZr6EHXyHzdtbs68PTg_0B5g1tXz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function rowToEntry(r) {
    return {
      id: r.id,
      type: r.type,
      text: r.text,
      scope: r.scope,
      date: r.entry_date,
      month: r.entry_month,
      status: r.status,
      collection: r.collection,
    };
  }

  async function fetchAllData() {
    const { data: entryRows, error: entryErr } = await sb
      .from('bujo_entries')
      .select('*')
      .order('id', { ascending: true });

    if (entryErr) {
      console.error(entryErr);
      alert('Could not load your journal: ' + entryErr.message);
      return { entries: [], collections: {}, lastProcessedMonth: null };
    }

    const { data: settingsRow } = await sb
      .from('bujo_settings')
      .select('*')
      .maybeSingle();

    const entries = (entryRows || []).map(rowToEntry);
    const collections = {};
    entries.forEach(e => { if (e.collection) collections[e.collection] = true; });

    return {
      entries,
      collections,
      lastProcessedMonth: settingsRow ? settingsRow.last_processed_month : null,
    };
  }

  async function insertEntry(type, text, opts = {}) {
    const scope = opts.scope || 'day';
    const row = {
      type,
      text,
      scope,
      entry_date: scope === 'month' ? null : (opts.date || todayStr()),
      entry_month: scope === 'month' ? (opts.month || curMonthKey()) : null,
      status: type === 'task' ? 'open' : null,
      collection: opts.collection || null,
    };
    const { data: inserted, error } = await sb.from('bujo_entries').insert(row).select().single();
    if (error) {
      console.error(error);
      alert('Could not save that: ' + error.message);
      return null;
    }
    const entry = rowToEntry(inserted);
    data.entries.push(entry);
    if (entry.collection) data.collections[entry.collection] = true;
    return entry;
  }

  async function updateEntryRemote(id, fields) {
    const dbFields = {};
    if ('status' in fields) dbFields.status = fields.status;
    if ('collection' in fields) dbFields.collection = fields.collection;
    if ('text' in fields) dbFields.text = fields.text;
    const { error } = await sb.from('bujo_entries').update(dbFields).eq('id', id);
    if (error) {
      console.error(error);
      alert('Could not update that: ' + error.message);
      return;
    }
    const entry = data.entries.find(e => e.id === id);
    if (entry) Object.assign(entry, fields);
  }

  async function deleteEntryRemote(id) {
    const { error } = await sb.from('bujo_entries').delete().eq('id', id);
    if (error) {
      console.error(error);
      alert('Could not delete that: ' + error.message);
      return;
    }
    data.entries = data.entries.filter(e => e.id !== id);
  }

  async function saveLastProcessedMonth(month) {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    const { error } = await sb.from('bujo_settings').upsert({ user_id: user.id, last_processed_month: month });
    if (error) console.error(error);
    data.lastProcessedMonth = month;
  }

  let data = { entries: [], collections: {}, lastProcessedMonth: null };
  let currentCaptureType = 'task';
  let activeCollection = null;

  // ---------- Helpers ----------
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function prettyDate(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function curMonthKey() {
    return todayStr().slice(0, 7); // "YYYY-MM"
  }

  function nextMonthKey(monthStr) {
    let [y, m] = monthStr.split('-').map(Number);
    m += 1;
    if (m > 12) { m = 1; y += 1; }
    return y + '-' + String(m).padStart(2, '0');
  }

  function monthLabel(monthStr) {
    const [y, m] = monthStr.split('-').map(Number);
    const dt = new Date(y, m - 1, 1);
    return dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  // Carries open tasks forward into the new month, then archives the
  // finished month's entries into a Collection named after that month.
  async function processMonthRollover() {
    const nowMonth = curMonthKey();
    if (!data.lastProcessedMonth) {
      await saveLastProcessedMonth(nowMonth);
      return;
    }
    while (data.lastProcessedMonth < nowMonth) {
      const oldMonth = data.lastProcessedMonth;
      const newMonth = nextMonthKey(oldMonth);
      const monthsEntries = data.entries.filter(e =>
        !e.collection && (
          (e.scope === 'month' && e.month === oldMonth) ||
          (e.scope !== 'month' && e.date && e.date.slice(0, 7) === oldMonth)
        )
      );
      for (const e of monthsEntries) {
        if (e.type === 'task' && e.status === 'open') {
          await updateEntryRemote(e.id, { status: 'migrated' });
          await insertEntry('task', e.text, { scope: 'month', month: newMonth });
        }
      }
      if (monthsEntries.length > 0) {
        const archiveName = monthLabel(oldMonth);
        data.collections[archiveName] = true;
        for (const e of monthsEntries) {
          await updateEntryRemote(e.id, { collection: archiveName });
        }
      }
      await saveLastProcessedMonth(newMonth);
    }
  }

  function symbolFor(entry) {
    if (entry.type === 'task') {
      if (entry.status === 'done') return 'X';
      if (entry.status === 'migrated') return '>';
      return '•';
    }
    if (entry.type === 'event') return '○';
    return '–';
  }

  function symbolClass(entry) {
    if (entry.type === 'task' && entry.status === 'done') return 'done';
    if (entry.type === 'task' && entry.status === 'migrated') return 'migrated';
    return '';
  }

  async function addEntry(type, text, opts = {}) {
    return await insertEntry(type, text, opts);
  }

  function entriesForDate(dateStr) {
    return data.entries.filter(e => e.scope !== 'month' && e.date === dateStr && !e.collection);
  }

  function openTasksBefore(dateStr) {
    return data.entries.filter(e => e.scope !== 'month' && e.type === 'task' && e.status === 'open' && e.date < dateStr && !e.collection);
  }

  function monthEntriesFor(monthStr) {
    return data.entries.filter(e => e.scope === 'month' && e.month === monthStr && !e.collection);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Rendering ----------
  const main = document.getElementById('main');
  const navButtons = document.querySelectorAll('#nav button');

  function setActiveNav(view) {
    navButtons.forEach(b => b.classList.toggle('active', b.dataset.view === view));
  }

  function renderEntryList(entries, opts = {}) {
    if (entries.length === 0) {
      return `<div class="empty-state">${opts.emptyText || 'Nothing logged yet.'}</div>`;
    }
    return `<ul class="entry-list">` + entries.map(e => `
      <li class="entry" data-id="${e.id}">
        <span class="entry-symbol ${symbolClass(e)}" ${e.type === 'task' ? 'onclick="toggleDone(' + e.id + ')" title="Toggle done"' : ''}>${symbolFor(e)}</span>
        <span class="entry-text ${e.status === 'done' ? 'done-text' : ''}">${escapeHtml(e.text)}</span>
        ${opts.showDate ? `<span class="entry-meta">${e.date}</span>` : ''}
        <button class="entry-del" onclick="deleteEntry(${e.id})" title="Delete">×</button>
      </li>
    `).join('') + `</ul>`;
  }

  function viewToday() {
    const dateStr = todayStr();
    const entries = entriesForDate(dateStr);
    const stale = openTasksBefore(dateStr);
    main.innerHTML = `
      <div class="panel-title">${prettyDate(dateStr)}</div>
      <div class="legend"><span>• task</span><span>○ event</span><span>– note</span><span>X done</span></div>
      ${stale.length ? `<div class="migrate-banner">
        <span>${stale.length} open task${stale.length === 1 ? '' : 's'} from earlier days.</span>
        <button class="btn subtle" onclick="switchView('migrate')">Review &amp; migrate</button>
      </div>` : ''}
      <div class="card">${renderEntryList(entries, { emptyText: 'Nothing logged today. Try Quick Capture.' })}</div>
    `;
  }

  function viewCapture() {
    main.innerHTML = `
      <div class="panel-title">Quick Capture</div>
      <div class="card">
        <div class="field-row">
          <div class="type-toggle">
            <button data-t="task" class="${currentCaptureType==='task'?'selected':''}" onclick="setCaptureType('task')">• Task</button>
            <button data-t="event" class="${currentCaptureType==='event'?'selected':''}" onclick="setCaptureType('event')">○ Event</button>
            <button data-t="note" class="${currentCaptureType==='note'?'selected':''}" onclick="setCaptureType('note')">– Note</button>
          </div>
        </div>
        <div class="field-row">
          <input type="text" id="captureText" placeholder="What's on your mind?" autofocus>
          <button class="btn" onclick="submitCapture()">Add</button>
        </div>
      </div>
      <div class="panel-title">Logged Today</div>
      <div class="card">${renderEntryList(entriesForDate(todayStr()))}</div>
    `;
    const input = document.getElementById('captureText');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCapture(); });
    input.focus();
  }

  function viewBrowse() {
    main.innerHTML = `
      <div class="panel-title">Browse a Date</div>
      <div class="card">
        <div class="field-row">
          <input type="date" id="browseDate" value="${todayStr()}">
          <button class="btn" onclick="renderBrowseResults()">View</button>
        </div>
      </div>
      <div id="browseResults"></div>
    `;
    renderBrowseResults();
  }

  function renderBrowseResults() {
    const dateStr = document.getElementById('browseDate').value || todayStr();
    const entries = entriesForDate(dateStr);
    document.getElementById('browseResults').innerHTML = `
      <div class="panel-title">${prettyDate(dateStr)}</div>
      <div class="card">${renderEntryList(entries)}</div>
    `;
  }

  function viewMigrate() {
    const dateStr = todayStr();
    const stale = openTasksBefore(dateStr);
    main.innerHTML = `
      <div class="panel-title">Migrate Open Tasks</div>
      ${stale.length === 0
        ? `<div class="card"><div class="empty-state">You're all caught up — nothing to migrate.</div></div>`
        : `<div class="card">
            ${renderEntryList(stale, { showDate: true })}
            <div class="field-row" style="margin-top:16px;">
              <button class="btn" onclick="migrateAll()">Migrate all ${stale.length} to today</button>
            </div>
          </div>`
      }
    `;
  }

  function viewCollections() {
    const names = Object.keys(data.collections);
    if (!activeCollection && names.length) activeCollection = names[0];
    main.innerHTML = `
      <div class="panel-title">Collections</div>
      <div class="card">
        <div class="field-row">
          <input type="text" id="newCollectionName" placeholder="New collection name...">
          <button class="btn" onclick="createCollection()">Create</button>
        </div>
      </div>
      ${names.length ? `
        <div class="collection-tabs">
          ${names.map(n => `<button class="collection-tab ${n===activeCollection?'active':''}" onclick="selectCollection('${escapeHtml(n).replace(/'/g,"\\'")}')">${escapeHtml(n)}</button>`).join('')}
        </div>
        ${activeCollection ? `
          <div class="card">
            <div class="field-row">
              <div class="type-toggle">
                <button data-t="task" class="${currentCaptureType==='task'?'selected':''}" onclick="setCaptureType('task')">• Task</button>
                <button data-t="event" class="${currentCaptureType==='event'?'selected':''}" onclick="setCaptureType('event')">○ Event</button>
                <button data-t="note" class="${currentCaptureType==='note'?'selected':''}" onclick="setCaptureType('note')">– Note</button>
              </div>
            </div>
            <div class="field-row">
              <input type="text" id="collectionItemText" placeholder="Add to ${escapeHtml(activeCollection)}...">
              <button class="btn" onclick="submitCollectionItem()">Add</button>
            </div>
            ${renderEntryList(data.entries.filter(e => e.collection === activeCollection))}
          </div>
        ` : ''}
      ` : `<div class="empty-state">No collections yet — create one above.</div>`}
    `;
    if (activeCollection) {
      const input = document.getElementById('collectionItemText');
      if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCollectionItem(); });
    }
  }

  function viewIndex() {
    const nowMonth = curMonthKey();
    const dates = [...new Set(data.entries.filter(e => e.scope !== 'month' && !e.collection).map(e => e.date))].sort().reverse();
    const collectionNames = Object.keys(data.collections);
    const monthlyItems = monthEntriesFor(nowMonth);
    main.innerHTML = `
      <div class="panel-title">Index</div>
      <div class="card">
        <div class="index-block">
          <h3>Monthly Log — ${monthLabel(nowMonth)}</h3>
          <div class="field-row">
            <div class="type-toggle">
              <button data-t="task" class="${currentCaptureType==='task'?'selected':''}" onclick="setCaptureType('task')">• Task</button>
              <button data-t="event" class="${currentCaptureType==='event'?'selected':''}" onclick="setCaptureType('event')">○ Event</button>
              <button data-t="note" class="${currentCaptureType==='note'?'selected':''}" onclick="setCaptureType('note')">– Note</button>
            </div>
          </div>
          <div class="field-row">
            <input type="text" id="monthlyLogText" placeholder="Goal, deadline, or reminder for ${monthLabel(nowMonth)}...">
            <button class="btn" onclick="submitMonthlyItem()">Add</button>
          </div>
          ${renderEntryList(monthlyItems, { emptyText: "Nothing on the month's log yet." })}
          <p style="font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:10px;">
            When ${monthLabel(nowMonth)} ends, any open items here migrate into next month automatically, and this month's entries move into Collections.
          </p>
        </div>
        <div class="index-block">
          <h3>Daily Logs</h3>
          ${dates.length ? dates.map(d => {
            const count = entriesForDate(d).length;
            return `<div class="index-row" onclick="jumpToDate('${d}')"><span>${prettyDate(d)}</span><span>${count} entr${count===1?'y':'ies'}</span></div>`;
          }).join('') : '<div class="empty-state">Nothing logged yet.</div>'}
        </div>
        ${collectionNames.length ? `
          <div class="index-block">
            <h3>Collections</h3>
            ${collectionNames.map(n => {
              const count = data.entries.filter(e => e.collection === n).length;
              return `<div class="index-row" onclick="jumpToCollection('${escapeHtml(n).replace(/'/g,"\\'")}')"><span>${escapeHtml(n)}</span><span>${count} item${count===1?'':'s'}</span></div>`;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
    const monthlyInput = document.getElementById('monthlyLogText');
    if (monthlyInput) monthlyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMonthlyItem(); });
  }

  function viewSearch() {
    main.innerHTML = `
      <div class="panel-title">Search</div>
      <div class="card">
        <div class="field-row">
          <input type="text" id="searchQuery" placeholder="Search all entries...">
          <button class="btn" onclick="runSearch()">Search</button>
        </div>
      </div>
      <div id="searchResults"></div>
    `;
    const input = document.getElementById('searchQuery');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    input.focus();
  }

  function runSearch() {
    const q = document.getElementById('searchQuery').value.trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!q) { results.innerHTML = ''; return; }
    const matches = data.entries.filter(e => e.text.toLowerCase().includes(q));
    results.innerHTML = `
      <div class="panel-title">${matches.length} match${matches.length===1?'':'es'}</div>
      <div class="card">${renderEntryList(matches, { showDate: true })}</div>
    `;
  }

  // ---------- Actions ----------
  async function toggleDone(id) {
    const e = data.entries.find(x => x.id === id);
    if (!e) return;
    const newStatus = e.status === 'done' ? 'open' : 'done';
    await updateEntryRemote(id, { status: newStatus });
    renderCurrentView();
  }

  async function deleteEntry(id) {
    await deleteEntryRemote(id);
    renderCurrentView();
  }

  function setCaptureType(t) {
    currentCaptureType = t;
    renderCurrentView();
  }

  async function submitCapture() {
    const input = document.getElementById('captureText');
    const text = input.value.trim();
    if (!text) return;
    await addEntry(currentCaptureType, text);
    input.value = '';
    renderCurrentView();
  }

  async function submitCollectionItem() {
    const input = document.getElementById('collectionItemText');
    const text = input.value.trim();
    if (!text || !activeCollection) return;
    await addEntry(currentCaptureType, text, { collection: activeCollection, date: todayStr() });
    input.value = '';
    renderCurrentView();
  }

  async function submitMonthlyItem() {
    const input = document.getElementById('monthlyLogText');
    const text = input.value.trim();
    if (!text) return;
    await addEntry(currentCaptureType, text, { scope: 'month', month: curMonthKey() });
    input.value = '';
    renderCurrentView();
  }

  function createCollection() {
    const input = document.getElementById('newCollectionName');
    const name = input.value.trim();
    if (!name) return;
    data.collections[name] = true;
    activeCollection = name;
    renderCurrentView();
  }

  function selectCollection(name) {
    activeCollection = name;
    renderCurrentView();
  }

  async function migrateAll() {
    const dateStr = todayStr();
    const stale = openTasksBefore(dateStr);
    for (const e of stale) {
      await updateEntryRemote(e.id, { status: 'migrated' });
      await addEntry('task', e.text, { date: dateStr });
    }
    renderCurrentView();
  }

  function jumpToDate(dateStr) {
    switchView('browse');
    setTimeout(() => {
      const el = document.getElementById('browseDate');
      if (el) { el.value = dateStr; renderBrowseResults(); }
    }, 0);
  }

  function jumpToCollection(name) {
    activeCollection = name;
    switchView('collections');
  }

  // ---------- View router ----------
  let currentView = 'today';
  const views = {
    today: viewToday,
    capture: viewCapture,
    browse: viewBrowse,
    migrate: viewMigrate,
    collections: viewCollections,
    index: viewIndex,
    search: viewSearch,
  };

  function renderCurrentView() {
    views[currentView]();
  }

  function switchView(view) {
    currentView = view;
    setActiveNav(view);
    renderCurrentView();
  }

  navButtons.forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

  // ---------- Auth gate ----------
  async function initApp() {
    data = await fetchAllData();
    await processMonthRollover();
    document.getElementById('headerDate').textContent = prettyDate(todayStr());
    renderCurrentView();
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
  }

  function showLogin() {
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    if (!email || !password) { errorEl.textContent = 'Enter your email and password.'; return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { errorEl.textContent = error.message; return; }
    showApp();
    await initApp();
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    showLogin();
  });

  (async function start() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showApp();
      await initApp();
    } else {
      showLogin();
    }
  })();
</script>

</body>
</html>
