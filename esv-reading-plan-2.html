<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reading</title>
<style>
  :root {
    --paper: #F5F1E6;
    --paper-line: #E6DFCB;
    --maroon: #7A1F2B;
    --maroon-soft: #9c3a45;
    --ink: #1A1816;
    --ink-soft: #4a453f;
    --card: #FBF8F0;
    --shadow: rgba(26, 24, 22, 0.10);
    --done: #4d6b4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 32px;
    background-position: 0 84px;
    font-weight: 500;
  }

  .margin-line {
    position: fixed;
    top: 0; bottom: 0; left: 72px;
    width: 1px;
    background: var(--maroon);
    opacity: 0.35;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 20px 32px 14px 88px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--paper-line);
  }

  header .title-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 0.03em;
    margin: 0;
    color: var(--ink);
    font-weight: 700;
  }

  header .subtitle {
    font-size: 13px;
    color: var(--maroon);
    font-style: italic;
    font-weight: 600;
  }

  .home-link {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--paper-line);
    color: var(--maroon);
    font-size: 16px;
    flex-shrink: 0;
  }
  .home-link:hover {
    background: var(--paper-line);
  }

  nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  nav button {
    all: unset;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 3px;
    color: var(--ink);
    border: 1px solid var(--paper-line);
  }
  nav button.active {
    background: var(--maroon);
    color: var(--paper);
    border-color: var(--maroon);
  }
  nav button:hover:not(.active) { background: var(--paper-line); }

  main {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 32px 60px 88px;
  }

  .today-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .passage-col {
    flex: 1;
    min-width: 0;
  }

  .notes-col {
    width: 320px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--paper-line);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--maroon);
  }

  .progress-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--maroon);
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 1px 4px var(--shadow);
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .passage-heading {
    font-size: 18px;
    font-weight: 700;
    color: var(--maroon);
    margin: 0 0 4px 0;
  }

  .passage-sub {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 16px;
  }

  .passage-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 12pt;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .passage-text .book-chapter-block {
    margin-bottom: 18px;
  }

  .passage-text .block-title {
    font-weight: 700;
    color: var(--maroon);
    display: block;
    margin-bottom: 6px;
    font-size: 13pt;
  }

  .verse-num {
    font-size: 9pt;
    font-weight: 700;
    color: var(--maroon-soft);
    vertical-align: super;
    margin-right: 1px;
  }

  .loading-state, .error-state, .empty-state {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 10px 0;
  }

  .error-state {
    color: var(--maroon);
    font-style: normal;
    font-weight: 600;
  }

  .btn {
    all: unset;
    cursor: pointer;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    background: var(--maroon);
    color: var(--paper);
    border-radius: 3px;
    text-align: center;
  }
  .btn:hover { background: var(--maroon-soft); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.subtle {
    background: transparent;
    color: var(--maroon);
    border: 1px solid var(--maroon);
  }
  .btn:disabled {
    background: var(--paper-line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .complete-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--paper-line);
  }

  .complete-note {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    font-family: Georgia, serif;
    font-size: 13px;
    line-height: 1.6;
    padding: 12px 14px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }
  textarea:focus {
    outline: 2px solid var(--maroon-soft);
    outline-offset: 1px;
  }

  .panel-title {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--maroon);
    font-weight: 700;
    margin: 0 0 12px 0;
  }

  .save-indicator {
    font-size: 11px;
    color: var(--done);
    font-style: italic;
    margin-top: 6px;
    min-height: 14px;
  }

  input[type=text] {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  input[type=text]:focus {
    outline: 2px solid var(--maroon-soft);
    outline-offset: 1px;
  }

  .search-result {
    padding: 14px 0;
    border-bottom: 1px dashed var(--paper-line);
  }
  .search-result:last-child { border-bottom: none; }

  .search-result .sr-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--maroon);
    margin-bottom: 4px;
  }

  .search-result .sr-date {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 400;
    font-style: italic;
  }

  .search-result .sr-snippet {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }

  .icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 15px;
    color: var(--ink-soft);
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--maroon); }

  mark {
    background: #f0d9a8;
    color: var(--ink);
    padding: 0 2px;
    border-radius: 2px;
  }

  footer {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 32px 40px 88px;
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  footer a { color: var(--maroon); }

  .completed-banner {
    background: #e3ead6;
    border: 1px solid #b9cf9e;
    border-radius: 4px;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--done);
    margin-bottom: 20px;
    text-align: center;
  }

  @media (max-width: 700px) {
    .margin-line { left: 16px; }
    header { padding-left: 32px; }
    main { padding-left: 24px; padding-right: 16px; }
    footer { padding-left: 24px; }
    .today-layout { flex-direction: column; }
    .notes-col { width: 100%; position: static; }
  }
</style>
</head>
<body>

<div class="margin-line"></div>

<header>
  <div class="title-block">
    <a class="home-link" href="index.html" title="Back to workspace">&#8962;</a>
    <h1>Daily Reading</h1>
    <span class="subtitle" id="headerSubtitle"></span>
  </div>
  <nav id="nav">
    <button data-view="today" class="active">Today</button>
    <button data-view="previous">Previous Days</button>
    <button data-view="search">Search Notes</button>
  </nav>
</header>

<main id="main"></main>

<footer>
  Scripture quotations are from the ESV&reg; Bible (The Holy Bible, English Standard Version&reg;), copyright &copy; 2001 by Crossway,
  a publishing ministry of Good News Publishers. Used by permission. All rights reserved.
  &nbsp;&middot;&nbsp; <a href="https://www.esv.org" target="_blank" rel="noopener">www.esv.org</a>
</footer>

<script>
  // ============ Bible structure: canonical order, chapter counts ============
  const BOOKS = [
    ["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],
    ["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],
    ["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],
    ["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],
    ["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],
    ["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],
    ["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],
    ["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
    ["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],
    ["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],
    ["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],
    ["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],
    ["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],
    ["Jude",1],["Revelation",22]
  ];

  const CHAPTERS_PER_DAY = 5;

  function buildAllChapters() {
    const all = [];
    for (const [book, count] of BOOKS) {
      for (let c = 1; c <= count; c++) all.push({ book, chapter: c });
    }
    return all;
  }

  function buildReadingDays() {
    const all = buildAllChapters();
    const days = [];
    for (let i = 0; i < all.length; i += CHAPTERS_PER_DAY) {
      days.push(all.slice(i, i + CHAPTERS_PER_DAY));
    }
    return days;
  }

  const ALL_CHAPTERS = buildAllChapters();
  const READING_DAYS = buildReadingDays();
  const TOTAL_DAYS = READING_DAYS.length;

  // ============ ESV API ============
  const ESV_API_KEY = '46eb88fdca716c9ea434ff3d72f1e5198681154d';
  const ESV_API_URL = 'https://api.esv.org/v3/passage/text/';

  function buildQueryRanges(dayChapters) {
    const ranges = [];
    let current = null;
    for (const { book, chapter } of dayChapters) {
      if (current && current.book === book && chapter === current.end + 1) {
        current.end = chapter;
      } else {
        if (current) ranges.push(current);
        current = { book, start: chapter, end: chapter };
      }
    }
    if (current) ranges.push(current);
    return ranges.map(r => r.start === r.end ? `${r.book} ${r.start}` : `${r.book} ${r.start}-${r.end}`);
  }

  async function fetchPassageText(query) {
    const params = new URLSearchParams({
      q: query,
      'include-verse-numbers': 'true',
      'include-headings': 'true',
      'include-footnotes': 'false',
      'include-short-copyright': 'false',
      'include-passage-references': 'false',
    });
    const res = await fetch(`${ESV_API_URL}?${params.toString()}`, {
      headers: { 'Authorization': `Token ${ESV_API_KEY}` }
    });
    if (!res.ok) {
      throw new Error(`ESV API returned ${res.status}`);
    }
    const json = await res.json();
    return (json.passages || []).join('\n\n');
  }

  async function fetchDayPassage(dayIndex) {
    const chapters = READING_DAYS[dayIndex];
    const queries = buildQueryRanges(chapters);
    const texts = [];
    for (const q of queries) {
      const text = await fetchPassageText(q);
      texts.push({ label: q, text });
    }
    return texts;
  }

  // ============ Storage ============
  const STORAGE_KEY = 'esv_reading_plan_v1';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error('Load failed', e); }
    return { currentDayIndex: 0, notes: {}, passageCache: {} };
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { console.error('Save failed', e); }
  }

  let data = loadData();

  // ============ Helpers ============
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function prettyDate(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function dayLabel(dayIndex) {
    if (dayIndex >= TOTAL_DAYS) return 'Reading plan complete';
    return buildQueryRanges(READING_DAYS[dayIndex]).join('; ');
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatPassageHtml(passages) {
    return passages.map(p => {
      const escaped = escapeHtml(p.text)
        .replace(/\[(\d+)\]/g, '<span class="verse-num">$1</span>');
      return `<div class="book-chapter-block">${escaped}</div>`;
    }).join('');
  }

  // ============ Views ============
  const main = document.getElementById('main');
  const navButtons = document.querySelectorAll('#nav button');
  let currentView = 'today';
  let saveNoteTimer = null;

  function setActiveNav(view) {
    navButtons.forEach(b => b.classList.toggle('active', b.dataset.view === view));
  }

  function updateHeaderSubtitle() {
    const el = document.getElementById('headerSubtitle');
    if (data.currentDayIndex >= TOTAL_DAYS) {
      el.textContent = 'Plan complete';
    } else {
      el.textContent = `Day ${data.currentDayIndex + 1} of ${TOTAL_DAYS}`;
    }
  }

  async function viewToday() {
    updateHeaderSubtitle();
    const dayIndex = data.currentDayIndex;

    if (dayIndex >= TOTAL_DAYS) {
      main.innerHTML = `
        <div class="completed-banner">You've reached Revelation 22 — the reading plan is complete.</div>
      `;
      return;
    }

    const pct = Math.round((dayIndex / TOTAL_DAYS) * 100);
    const label = dayLabel(dayIndex);
    const noteObj = data.notes[dayIndex] || { text: '' };

    main.innerHTML = `
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">Day ${dayIndex + 1} of ${TOTAL_DAYS}</div>
      </div>
      <div class="today-layout">
        <div class="passage-col">
          <div class="card">
            <div class="passage-heading">${escapeHtml(label)}</div>
            <div class="passage-sub">${prettyDate(todayStr())}</div>
            <div id="passageBody" class="passage-text">
              <div class="loading-state">Loading passage...</div>
            </div>
          </div>
        </div>
        <div class="notes-col">
          <div class="card">
            <div class="panel-title">Notes</div>
            <textarea id="notesArea" placeholder="Jot down thoughts on today's reading...">${escapeHtml(noteObj.text)}</textarea>
            <div class="save-indicator" id="saveIndicator"></div>
            <div class="complete-row">
              <button class="btn" id="completeBtn">Mark day complete</button>
            </div>
            <div class="complete-note" style="margin-top:8px;">Advances you to the next day's reading</div>
          </div>
        </div>
      </div>
    `;

    const textarea = document.getElementById('notesArea');
    textarea.addEventListener('input', () => {
      clearTimeout(saveNoteTimer);
      saveNoteTimer = setTimeout(() => {
        data.notes[dayIndex] = { text: textarea.value, date: data.notes[dayIndex]?.date || todayStr() };
        saveData();
        const ind = document.getElementById('saveIndicator');
        if (ind) {
          ind.textContent = 'Saved';
          setTimeout(() => { if (ind) ind.textContent = ''; }, 1500);
        }
      }, 500);
    });

    document.getElementById('completeBtn').addEventListener('click', () => markDayComplete(dayIndex));

    await loadPassageInto(dayIndex);
  }

  async function loadPassageInto(dayIndex, bodyId = 'passageBody') {
    const body = document.getElementById(bodyId);
    if (!body) return;

    if (data.passageCache[dayIndex]) {
      body.innerHTML = formatPassageHtml(data.passageCache[dayIndex]);
      return;
    }

    try {
      const passages = await fetchDayPassage(dayIndex);
      data.passageCache[dayIndex] = passages;
      saveData();
      if (document.getElementById(bodyId)) {
        body.innerHTML = formatPassageHtml(passages);
      }
    } catch (err) {
      console.error(err);
      if (document.getElementById(bodyId)) {
        body.innerHTML = `
          <div class="error-state">
            Couldn't load this passage (${escapeHtml(err.message)}).
            This is usually a network issue, or the ESV API blocking the request from a locally-opened file.
          </div>
          <button class="btn subtle" style="margin-top:10px;" onclick="retryLoad(${dayIndex}, '${bodyId}')">Try again</button>
        `;
      }
    }
  }

  function retryLoad(dayIndex, bodyId = 'passageBody') {
    delete data.passageCache[dayIndex];
    loadPassageInto(dayIndex, bodyId);
  }

  function markDayComplete(dayIndex) {
    const textarea = document.getElementById('notesArea');
    if (textarea) {
      data.notes[dayIndex] = { text: textarea.value, date: todayStr() };
    } else if (data.notes[dayIndex]) {
      data.notes[dayIndex].date = todayStr();
    }
    data.currentDayIndex = dayIndex + 1;
    saveData();
    renderCurrentView();
  }

  function deleteNote(dayIndex, onDone) {
    if (!data.notes[dayIndex] || !data.notes[dayIndex].text) return;
    const ok = confirm('Delete your notes for this day? This can\'t be undone.');
    if (!ok) return;
    delete data.notes[dayIndex];
    saveData();
    if (onDone) onDone();
  }

  function viewSearch() {
    main.innerHTML = `
      <div class="panel-title">Search Previous Notes</div>
      <div class="card">
        <input type="text" id="searchInput" placeholder="Search by keyword, e.g. 'light'">
      </div>
      <div id="searchResults"></div>
    `;
    const input = document.getElementById('searchInput');
    input.addEventListener('input', () => runSearch(input.value));
    input.focus();
  }

  function highlightMatch(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  function runSearch(query) {
    const results = document.getElementById('searchResults');
    const q = query.trim();
    if (!q) { results.innerHTML = ''; return; }

    const matches = [];
    for (const key of Object.keys(data.notes)) {
      const dayIndex = parseInt(key, 10);
      if (dayIndex >= data.currentDayIndex) continue; // only completed (previous) days
      const note = data.notes[key];
      if (note.text && note.text.toLowerCase().includes(q.toLowerCase())) {
        matches.push({ dayIndex, note });
      }
    }
    matches.sort((a, b) => b.dayIndex - a.dayIndex);

    if (matches.length === 0) {
      results.innerHTML = `<div class="card"><div class="empty-state">No previous notes match "${escapeHtml(q)}".</div></div>`;
      return;
    }

    results.innerHTML = `<div class="card">` + matches.map(m => `
      <div class="search-result">
        <div class="sr-head">
          <span>${escapeHtml(dayLabel(m.dayIndex))}</span>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="sr-date">${m.note.date ? prettyDate(m.note.date) : ''}</span>
            <button class="icon-btn" onclick="deleteNote(${m.dayIndex}, () => runSearch(document.getElementById('searchInput').value))" title="Delete note">&times;</button>
          </div>
        </div>
        <div class="sr-snippet">${highlightMatch(m.note.text, q)}</div>
      </div>
    `).join('') + `</div>`;
  }

  // ============ Previous Days ============
  let selectedPreviousDay = null;

  function viewPrevious() {
    if (selectedPreviousDay !== null) {
      renderPreviousDayDetail(selectedPreviousDay);
    } else {
      renderPreviousDaysList();
    }
  }

  function renderPreviousDaysList() {
    const completed = [];
    for (let i = 0; i < data.currentDayIndex; i++) completed.push(i);
    completed.reverse(); // most recent first

    main.innerHTML = `
      <div class="panel-title">Previous Days</div>
      ${completed.length === 0
        ? `<div class="card"><div class="empty-state">No previous days yet — complete today's reading to start building your history.</div></div>`
        : `<div class="card">` + completed.map(i => {
            const note = data.notes[i];
            const snippet = note && note.text ? note.text.replace(/\s+/g, ' ').trim().slice(0, 100) : '';
            return `
              <div class="search-result">
                <div class="sr-head">
                  <span style="cursor:pointer;" onclick="openPreviousDay(${i})">${escapeHtml(dayLabel(i))}</span>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span class="sr-date">${note && note.date ? prettyDate(note.date) : ''}</span>
                    ${note && note.text ? `<button class="icon-btn" onclick="deleteNote(${i}, renderPreviousDaysList)" title="Delete note">&times;</button>` : ''}
                  </div>
                </div>
                <div class="sr-snippet" style="cursor:pointer;" onclick="openPreviousDay(${i})">${escapeHtml(snippet) || '<span style="font-style:italic;">No notes yet — click to open and read again.</span>'}</div>
              </div>
            `;
          }).join('') + `</div>`
      }
    `;
  }

  function openPreviousDay(dayIndex) {
    selectedPreviousDay = dayIndex;
    viewPrevious();
  }

  function renderPreviousDayDetail(dayIndex) {
    const label = dayLabel(dayIndex);
    const noteObj = data.notes[dayIndex] || { text: '' };

    main.innerHTML = `
      <button class="btn subtle" style="margin-bottom:16px;" onclick="closePreviousDay()">&larr; Back to Previous Days</button>
      <div class="today-layout">
        <div class="passage-col">
          <div class="card">
            <div class="passage-heading">${escapeHtml(label)}</div>
            <div class="passage-sub">Day ${dayIndex + 1} of ${TOTAL_DAYS}</div>
            <div id="prevPassageBody" class="passage-text">
              <div class="loading-state">Loading passage...</div>
            </div>
          </div>
        </div>
        <div class="notes-col">
          <div class="card">
            <div class="panel-title">Notes</div>
            <textarea id="prevNotesArea" placeholder="Add new thoughts on this passage...">${escapeHtml(noteObj.text)}</textarea>
            <div class="save-indicator" id="prevSaveIndicator"></div>
            <div class="complete-row">
              <button class="btn subtle" id="deletePrevNoteBtn">Delete Notes</button>
            </div>
          </div>
        </div>
      </div>
    `;

    const textarea = document.getElementById('prevNotesArea');
    textarea.addEventListener('input', () => {
      clearTimeout(saveNoteTimer);
      saveNoteTimer = setTimeout(() => {
        data.notes[dayIndex] = { text: textarea.value, date: data.notes[dayIndex]?.date || todayStr() };
        saveData();
        const ind = document.getElementById('prevSaveIndicator');
        if (ind) {
          ind.textContent = 'Saved';
          setTimeout(() => { if (ind) ind.textContent = ''; }, 1500);
        }
      }, 500);
    });

    document.getElementById('deletePrevNoteBtn').addEventListener('click', () => {
      deleteNote(dayIndex, () => renderPreviousDayDetail(dayIndex));
    });

    loadPassageInto(dayIndex, 'prevPassageBody');
  }

  function closePreviousDay() {
    selectedPreviousDay = null;
    viewPrevious();
  }

  // ============ Router ============
  const views = { today: viewToday, previous: viewPrevious, search: viewSearch };

  function renderCurrentView() {
    updateHeaderSubtitle();
    views[currentView]();
  }

  function switchView(view) {
    currentView = view;
    setActiveNav(view);
    renderCurrentView();
  }

  navButtons.forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

  renderCurrentView();
</script>

</body>
</html>
