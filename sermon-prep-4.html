  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  header {
    text-align: center;
    padding: 18px 24px 24px;
    margin-bottom: 6px;
    background: linear-gradient(180deg, rgba(20,12,4,0.55), rgba(20,12,4,0.25));
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--brass-bright);
    text-shadow: 0 2px 8px rgba(0,0,0,0.85), 0 0 18px rgba(0,0,0,0.5);
  }

  header .sub {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,234,210,0.85);
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .tab-btn {
    all: unset;
    cursor: pointer;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 10px 20px;
    border-radius: 5px 5px 0 0;
    background: rgba(20,12,4,0.55);
    color: rgba(244,234,210,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    border: 1px solid rgba(169,120,47,0.3);
    border-bottom: none;
  }
  .tab-btn.active {
    background: var(--parchment);
    color: var(--ink);
    border-color: var(--brass);
  }
  .tab-btn:hover:not(.active) { background: rgba(20,12,4,0.55); color: var(--parchment); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--parchment);
    border-radius: 6px;
    box-shadow: 0 8px 28px var(--shadow);
    border: 1px solid rgba(169,120,47,0.25);
  }

  /* ---------- Search ---------- */
  .search-card {
    padding: 18px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  input[type=text] {
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 11px 14px;
    border: 1px solid rgba(169,120,47,0.4);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    flex: 1;
    min-width: 220px;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--brass);
    box-shadow: 0 0 0 2px rgba(169,120,47,0.25);
  }
  input[type=text]::placeholder { color: #8f97a0; font-style: italic; }

  .btn {
    all: unset;
    cursor: pointer;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 11px 20px;
    border-radius: 4px;
    background: linear-gradient(160deg, var(--brass-bright), var(--brass));
    color: #2b2013;
    text-align: center;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
  .btn.subtle {
    background: transparent;
    border: 1px solid var(--brass);
    color: var(--brass);
  }
  .btn.danger { background: linear-gradient(160deg, #b5665f, #8f4842); color: #fff; }
  .btn:disabled { background: #c7ccd1; color: #7c828a; cursor: not-allowed; }

  .search-status {
    width: 100%;
    font-size: 12px;
    font-style: italic;
    color: var(--ink-soft);
    min-height: 14px;
  }
  .search-status.error { color: #9c3b34; }

  /* ---------- Prepare layout ---------- */
  .prep-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .passage-col {
    width: 320px;
    flex-shrink: 0;
  }

  .notes-col {
    flex: 1;
    min-width: 0;
  }

  .passage-card {
    padding: 18px 18px 22px;
    max-height: 78vh;
    overflow-y: auto;
    position: sticky;
    top: 16px;
  }

  .passage-ref {
    font-size: 16px;
    font-weight: 700;
    color: var(--green);
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(169,120,47,0.3);
  }

  .passage-text {
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .passage-heading-block {
    font-weight: 700;
    color: var(--brass);
    font-size: 13px;
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .passage-heading-block:first-child { margin-top: 0; }

  .verse-num {
    font-size: 9px;
    font-weight: 700;
    color: var(--brass);
    vertical-align: super;
    margin-right: 1px;
  }

  .passage-placeholder {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 13px;
  }

  /* ---------- Editor ---------- */
  .editor-card {
    padding: 16px 18px 18px;
  }

  .editor-toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(169,120,47,0.25);
  }

  .tool-btn {
    all: unset;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    border: 1px solid rgba(169,120,47,0.3);
    color: var(--ink);
    font-size: 14px;
    background: rgba(255,255,255,0.4);
  }
  .tool-btn:hover { background: rgba(217,174,95,0.3); }
  .tool-btn.b { font-weight: 700; }
  .tool-btn.i { font-style: italic; }

  #notesEditor {
    min-height: 480px;
    font-family: Georgia, serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    padding: 6px 4px;
    outline: none;
  }
  #notesEditor:empty::before {
    content: attr(data-placeholder);
    color: #8f97a0;
    font-style: italic;
  }
  #notesEditor ul, #notesEditor ol { margin: 6px 0; padding-left: 26px; }
  #notesEditor li { margin-bottom: 4px; }

  .save-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed rgba(169,120,47,0.3);
  }

  .save-status {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .save-status.ok { color: var(--green); }

  /* ---------- Archive ---------- */
  .archive-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .archive-hint {
    font-size: 12px;
    color: rgba(244,234,210,0.85);
    font-style: italic;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .archive-item {
    padding: 14px 18px;
  }

  .archive-item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .archive-item-head input[type=checkbox] {
    margin-top: 4px;
    accent-color: var(--brass);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .archive-item-info { flex: 1; cursor: pointer; }

  .archive-item-ref {
    font-weight: 700;
    font-size: 14px;
    color: var(--green);
  }

  .archive-item-date {
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 2px;
  }

  .archive-item-preview {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .archive-item-full {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed rgba(169,120,47,0.3);
    font-size: 14px;
    line-height: 1.6;
  }
  .archive-item.expanded .archive-item-full { display: block; }

  .archive-item-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 15px;
    color: var(--ink-soft);
    padding: 4px 6px;
  }
  .icon-btn:hover { color: #9c3b34; }

  .empty-state {
    text-align: center;
    color: rgba(244,234,210,0.6);
    font-style: italic;
    font-size: 13px;
    padding: 30px 20px;
  }

  /* ---------- Outline ---------- */
  .outline-card {
    padding: 20px 22px;
  }

  .outline-ref {
    font-size: 15px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 14px;
  }

  .outline-list {
    list-style: none;
    padding: 0;
    margin: 0 0 18px 0;
    counter-reset: roman-counter;
  }
  .outline-list li {
    counter-increment: roman-counter;
    padding: 8px 0 8px 34px;
    position: relative;
    font-size: 14px;
    border-bottom: 1px dashed rgba(169,120,47,0.25);
  }
  .outline-list li::before {
    content: counter(roman-counter, upper-roman) ".";
    position: absolute;
    left: 0;
    font-weight: 700;
    color: var(--brass);
  }

  .outline-block { margin-bottom: 18px; }
  .outline-block > strong { display: block; font-size: 15px; color: var(--green); margin-bottom: 6px; }
  .outline-sub { margin: 4px 0 4px 20px; font-size: 14px; }
  .outline-editable {
    outline: none;
    border-bottom: 1px dashed rgba(169,120,47,0.5);
    padding: 2px 4px;
  }
  .outline-editable:empty::before { content: attr(data-placeholder); color: #8f97a0; font-style: italic; }
  .outline-note {
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .outline-actions {
    display: flex;
    gap: 10px;
    margin: 18px 0;
    flex-wrap: wrap;
  }
  .outline-source {
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px dashed rgba(169,120,47,0.3);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .outline-source-item { margin-bottom: 12px; }
  .outline-source-item strong { color: var(--green); }

  @media (max-width: 860px) {
    .prep-layout { flex-direction: column; }
    .passage-col { width: 100%; }
    .passage-card { position: static; max-height: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Sermon Preparation</h1>
    <div class="sub">A quiet place to study</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="prepare">Prepare</button>
    <button class="tab-btn" data-tab="archive">Archived Notes</button>
    <button class="tab-btn" data-tab="outline">Outline Suggestions</button>
  </div>

  <!-- ===== PREPARE TAB ===== -->
  <div class="tab-panel active" id="tab-prepare">
    <div class="card search-card">
      <input type="text" id="searchInput" placeholder="Where are we looking today?">
      <button class="btn" id="searchBtn">Search</button>
      <div class="search-status" id="searchStatus"></div>
    </div>

    <div class="prep-layout">
      <div class="passage-col">
        <div class="card passage-card">
          <div class="passage-ref" id="passageRef">No passage loaded</div>
          <div class="passage-text" id="passageText">
            <div class="passage-placeholder">Search a passage above to bring it up here.</div>
          </div>
        </div>
      </div>

      <div class="notes-col">
        <div class="card editor-card">
          <div class="editor-toolbar">
            <button class="tool-btn b" id="boldBtn" title="Bold (Ctrl/Cmd+B)">B</button>
            <button class="tool-btn i" id="italicBtn" title="Italic (Ctrl/Cmd+I)">I</button>
            <button class="tool-btn" id="bulletBtn" title="Bullet list">&#8226;</button>
            <button class="tool-btn" id="numberBtn" title="Numbered list">1.</button>
          </div>
          <div id="notesEditor" contenteditable="true" data-placeholder="Start typing your notes here. Type &quot;- &quot; or &quot;* &quot; at the start of a line for a bullet, or use the toolbar above."></div>
          <div class="save-row">
            <button class="btn" id="saveBtn">Save to Archive</button>
            <span class="save-status" id="saveStatus"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ARCHIVE TAB ===== -->
  <div class="tab-panel" id="tab-archive">
    <div class="archive-toolbar">
      <span class="archive-hint">Select two or more notes to merge them into one, oldest first.</span>
      <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
        <button class="btn subtle" id="mergeBtn" disabled>Merge Selected</button>
        <button class="btn subtle" id="createOutlineBtn" disabled>Create Outline</button>
      </div>
    </div>
    <div id="archiveContainer"></div>
  </div>

  <!-- ===== OUTLINE TAB ===== -->
  <div class="tab-panel" id="tab-outline">
    <div class="card outline-card" id="outlineCard">
      <div class="passage-placeholder">Search a passage on the Prepare tab first, then come back here for a suggested outline.</div>
    </div>
  </div>
</div>

<script>
  // ============ ESV API ============
  const ESV_API_KEY = '46eb88fdca716c9ea434ff3d72f1e5198681154d';
  const ESV_API_URL = 'https://api.esv.org/v3/passage/text/';

  async function fetchSermonPassage(query) {
    const params = new URLSearchParams({
      q: query,
      'include-verse-numbers': 'true',
      'include-headings': 'true',
      'include-footnotes': 'false',
      'include-short-copyright': 'false',
      'include-passage-references': 'false',
    });
    const res = await fetch(`${ESV_API_URL}?${params.toString()}`, {
      headers: { 'Authorization': `Token ${ESV_API_KEY}` }
    });
    if (!res.ok) throw new Error(`ESV API returned ${res.status}`);
    const json = await res.json();
    return {
      canonical: json.canonical || query,
      text: (json.passages || []).join('\n\n'),
    };
  }

  // Split passage text into heading / verse blocks.
  // Any block that doesn't contain a "[" verse-number marker is treated as a heading,
  // since include-verse-numbers:true always prefixes verse text with [n].
  function parsePassageBlocks(text) {
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    return blocks.map(b => ({
      type: b.includes('[') ? 'verses' : 'heading',
      content: b,
    }));
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatPassageHtml(blocks) {
    return blocks.map(b => {
      if (b.type === 'heading') {
        return `<div class="passage-heading-block">${escapeHtml(b.content)}</div>`;
      }
      const escaped = escapeHtml(b.content).replace(/\[(\d+)\]/g, '<span class="verse-num">$1</span>');
      return `<div>${escaped}</div>`;
    }).join('');
  }

  // ============ Storage ============
  const ARCHIVE_KEY = 'sermon_prep_archive_v1';
  const DRAFT_KEY = 'sermon_prep_draft_v1';
  const OUTLINE_DRAFT_KEY = 'sermon_prep_outline_draft_v1';
  const CLAUDE_KEY_STORAGE = 'sermon_prep_claude_api_key_v1';

  function getStoredClaudeKey() {
    try { return localStorage.getItem(CLAUDE_KEY_STORAGE) || ''; } catch (e) { return ''; }
  }
  function setStoredClaudeKey(key) {
    try { localStorage.setItem(CLAUDE_KEY_STORAGE, key); } catch (e) {}
  }

  function loadArchive() {
    try {
      const raw = localStorage.getItem(ARCHIVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error(e); }
    return { notes: [] };
  }
  function saveArchive() {
    try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archiveData)); }
    catch (e) { console.error(e); }
  }

  function loadDraft() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error(e); }
    return null;
  }
  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        reference: state.reference,
        passageHtml: state.passageHtml,
        headings: state.headings,
        editorHtml: document.getElementById('notesEditor').innerHTML,
        currentNoteId: state.currentNoteId,
      }));
    } catch (e) { console.error(e); }
  }

  let archiveData = loadArchive();
  let state = { reference: null, passageHtml: null, headings: [], currentNoteId: null };
  let selectedArchiveIds = new Set();

  function loadOutlineDraft() {
    try {
      const raw = localStorage.getItem(OUTLINE_DRAFT_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error(e); }
    return null;
  }
  let outlineSourceState = loadOutlineDraft();

  function htmlToPlainText(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function prettyDateTime(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' at ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  // ============ Tabs ============
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'archive') renderArchive();
      if (btn.dataset.tab === 'outline') renderOutline();
    });
  });

  // ============ Search / Passage ============
  async function runSearch() {
    const input = document.getElementById('searchInput');
    const statusEl = document.getElementById('searchStatus');
    const query = input.value.trim();
    if (!query) return;

    const editor = document.getElementById('notesEditor');
    if (editor.innerText.trim().length > 0 && query !== state.reference) {
      const proceed = confirm('Loading a new passage will clear your current notes unless you\'ve saved them. Continue?');
      if (!proceed) return;
    }

    statusEl.textContent = 'Looking that up...';
    statusEl.className = 'search-status';
    try {
      const { canonical, text } = await fetchSermonPassage(query);
      const blocks = parsePassageBlocks(text);
      state.reference = canonical;
      state.passageHtml = formatPassageHtml(blocks);
      state.headings = blocks.filter(b => b.type === 'heading').map(b => b.content);
      state.currentNoteId = null;

      document.getElementById('passageRef').textContent = canonical;
      document.getElementById('passageText').innerHTML = state.passageHtml;
      editor.innerHTML = '';
      document.getElementById('saveStatus').textContent = '';
      statusEl.textContent = '';
      saveDraft();
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Couldn't load that passage (${err.message}). Check the reference and your connection.`;
      statusEl.className = 'search-status error';
    }
  }

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

  // ============ Editor formatting ============
  const editor = document.getElementById('notesEditor');

  try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}

  document.getElementById('boldBtn').addEventListener('click', () => { editor.focus(); document.execCommand('bold'); });
  document.getElementById('italicBtn').addEventListener('click', () => { editor.focus(); document.execCommand('italic'); });
  document.getElementById('bulletBtn').addEventListener('click', () => { editor.focus(); document.execCommand('insertUnorderedList'); });
  document.getElementById('numberBtn').addEventListener('click', () => { editor.focus(); document.execCommand('insertOrderedList'); });

  function getBlockElement(node) {
    while (node && node.nodeType !== 1) node = node.parentNode;
    while (node && node.parentNode !== editor && node !== editor) node = node.parentNode;
    return node;
  }

  // Auto-convert "- " or "* " at the start of a line into a bullet list.
  editor.addEventListener('input', () => {
    try {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      const block = getBlockElement(range.startContainer);
      if (!block) return;
      const blockText = block.textContent || '';
      if (/^[-*]\s$/.test(blockText)) {
        block.textContent = '';
        document.execCommand('insertUnorderedList');
      }
    } catch (e) { /* fail silently; toolbar buttons remain available */ }
    saveDraft();
  });

  editor.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); document.execCommand('bold'); }
    if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); document.execCommand('italic'); }
  });

  // ============ Save to Archive ============
  document.getElementById('saveBtn').addEventListener('click', () => {
    const statusEl = document.getElementById('saveStatus');
    if (!state.reference) {
      statusEl.textContent = 'Search a passage before saving.';
      statusEl.className = 'save-status';
      return;
    }
    const contentHtml = editor.innerHTML;
    const now = new Date().toISOString();

    if (state.currentNoteId) {
      const note = archiveData.notes.find(n => n.id === state.currentNoteId);
      if (note) {
        note.contentHtml = contentHtml;
        note.dateSaved = now;
      }
    } else {
      const note = {
        id: Date.now(),
        reference: state.reference,
        contentHtml,
        dateSaved: now,
      };
      archiveData.notes.unshift(note);
      state.currentNoteId = note.id;
    }
    saveArchive();
    saveDraft();
    statusEl.textContent = 'Saved to archive.';
    statusEl.className = 'save-status ok';
    setTimeout(() => { if (statusEl) { statusEl.textContent = ''; statusEl.className = 'save-status'; } }, 2000);
  });

  // ============ Archive tab ============
  function renderArchive() {
    const container = document.getElementById('archiveContainer');
    if (archiveData.notes.length === 0) {
      container.innerHTML = `<div class="empty-state">Nothing archived yet. Save a note from the Prepare tab to see it here.</div>`;
      updateMergeBtn();
      return;
    }
    const sorted = [...archiveData.notes].sort((a, b) => new Date(b.dateSaved) - new Date(a.dateSaved));
    container.innerHTML = `<div class="archive-list">` + sorted.map(note => `
      <div class="card archive-item" id="archive-${note.id}">
        <div class="archive-item-head">
          <input type="checkbox" onchange="toggleArchiveSelect(${note.id}, this.checked)" ${selectedArchiveIds.has(note.id) ? 'checked' : ''}>
          <div class="archive-item-info" onclick="toggleExpand(${note.id})">
            <div class="archive-item-ref">${escapeHtml(note.reference)}</div>
            <div class="archive-item-date">${prettyDateTime(note.dateSaved)}</div>
            <div class="archive-item-preview">${(note.contentHtml || '').replace(/<[^>]+>/g, ' ').trim() || 'No notes written.'}</div>
          </div>
          <div class="archive-item-actions">
            <button class="icon-btn" onclick="deleteArchiveNote(${note.id})" title="Delete">&times;</button>
          </div>
        </div>
        <div class="archive-item-full">${note.contentHtml || ''}</div>
      </div>
    `).join('') + `</div>`;
    updateMergeBtn();
  }

  function toggleExpand(id) {
    const el = document.getElementById(`archive-${id}`);
    if (el) el.classList.toggle('expanded');
  }

  function toggleArchiveSelect(id, checked) {
    if (checked) selectedArchiveIds.add(id); else selectedArchiveIds.delete(id);
    updateMergeBtn();
  }

  function updateMergeBtn() {
    document.getElementById('mergeBtn').disabled = selectedArchiveIds.size < 2;
    document.getElementById('createOutlineBtn').disabled = selectedArchiveIds.size < 1;
  }

  function deleteArchiveNote(id) {
    archiveData.notes = archiveData.notes.filter(n => n.id !== id);
    selectedArchiveIds.delete(id);
    saveArchive();
    renderArchive();
  }

  document.getElementById('mergeBtn').addEventListener('click', () => {
    const selected = archiveData.notes.filter(n => selectedArchiveIds.has(n.id));
    if (selected.length < 2) return;
    selected.sort((a, b) => new Date(a.dateSaved) - new Date(b.dateSaved)); // oldest first

    const mergedHtml = selected.map(n => `
      <div style="font-weight:700; color:var(--green); margin-top:14px;">${escapeHtml(n.reference)} &mdash; ${prettyDateTime(n.dateSaved)}</div>
      <div style="margin-top:6px;">${n.contentHtml || ''}</div>
    `).join('<hr style="margin:16px 0; border:none; border-top:1px dashed rgba(169,120,47,0.35);">');

    const mergedNote = {
      id: Date.now(),
      reference: selected.map(n => n.reference).join(' + '),
      contentHtml: mergedHtml,
      dateSaved: new Date().toISOString(),
    };

    archiveData.notes = archiveData.notes.filter(n => !selectedArchiveIds.has(n.id));
    archiveData.notes.unshift(mergedNote);
    selectedArchiveIds.clear();
    saveArchive();
    renderArchive();
  });

  document.getElementById('createOutlineBtn').addEventListener('click', () => {
    const selected = archiveData.notes.filter(n => selectedArchiveIds.has(n.id));
    if (selected.length === 0) return;
    selected.sort((a, b) => new Date(a.dateSaved) - new Date(b.dateSaved)); // oldest first

    const sourceNotes = selected.map(n => ({
      reference: n.reference,
      text: htmlToPlainText(n.contentHtml),
      dateSaved: n.dateSaved,
    }));
    const combinedRefs = [...new Set(selected.map(n => n.reference))].join('; ');

    outlineSourceState = { sourceNotes, combinedRefs, generatedAt: new Date().toISOString() };
    try { localStorage.setItem(OUTLINE_DRAFT_KEY, JSON.stringify(outlineSourceState)); } catch (e) { console.error(e); }

    document.querySelector('.tab-btn[data-tab="outline"]').click();
  });

  // ============ Outline tab ============
  function renderOutline() {
    const card = document.getElementById('outlineCard');
    if (outlineSourceState) {
      renderSynthesizedOutline(outlineSourceState);
      return;
    }
    card.innerHTML = `<div class="passage-placeholder">No outline yet. Go to Archived Notes, select the notes you want to draw from, and click "Create Outline."</div>`;
  }

  function renderSynthesizedOutline(src) {
    const card = document.getElementById('outlineCard');
    const sourceHtml = src.sourceNotes.map(n => `
      <div class="outline-source-item">
        <strong>${escapeHtml(n.reference)}</strong> &mdash; ${prettyDateTime(n.dateSaved)}
        <div>${escapeHtml(n.text).slice(0, 600)}${n.text.length > 600 ? '…' : ''}</div>
      </div>
    `).join('');

    const hasKey = !!getStoredClaudeKey();

    card.innerHTML = `
      <div class="outline-ref">Synthesized Outline &mdash; ${escapeHtml(src.combinedRefs)}</div>
      <div class="outline-note">
        Click "Generate with Claude" to have your notes synthesized automatically, or fill the fields in yourself.
      </div>

      <div id="claudeKeyRow" style="${hasKey ? 'display:none;' : ''} margin-bottom:16px; padding:12px 14px; background:rgba(0,0,0,0.03); border-radius:4px;">
        <div class="outline-note" style="margin-bottom:8px;">
          Paste your Anthropic API key to enable AI generation. It's stored only in this browser, never in the page itself.
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--brass);">Get a key &#8599;</a>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="password" id="claudeKeyInput" placeholder="sk-ant-..." style="flex:1; min-width:200px; padding:9px 12px; border:1px solid rgba(169,120,47,0.4); border-radius:4px; font-family:Georgia, serif; font-size:13px; background:#fff;">
          <button class="btn subtle" id="saveClaudeKeyBtn">Save Key</button>
        </div>
      </div>

      <div class="outline-block">
        <strong>I. Introduction</strong>
        <div class="outline-sub">A. Passage: <strong>${escapeHtml(src.combinedRefs)}</strong></div>
        <div class="outline-sub">B. Prayer</div>
        <div class="outline-sub">C. Example</div>
        <div class="outline-sub">D. Thesis: <span class="outline-editable" contenteditable="true" data-placeholder="Write a suggested thesis here..." id="thesisField"></span></div>
      </div>

      <div class="outline-block">
        <strong>II.</strong>
        <div class="outline-editable" contenteditable="true" data-placeholder="First point that supports the thesis..." id="pointII" style="min-height:40px;"></div>
      </div>
      <div class="outline-block">
        <strong>III.</strong>
        <div class="outline-editable" contenteditable="true" data-placeholder="Second point that supports the thesis..." id="pointIII" style="min-height:40px;"></div>
      </div>
      <div class="outline-block">
        <strong>IV.</strong>
        <div class="outline-editable" contenteditable="true" data-placeholder="Third point that supports the thesis..." id="pointIV" style="min-height:40px;"></div>
      </div>

      <div class="outline-block">
        <strong>V. Conclusion</strong>
        <div class="outline-sub">A. Closing reflection question: <span class="outline-editable" contenteditable="true" data-placeholder="What question invites reflection?" id="reflectionField"></span></div>
        <div class="outline-sub">B. Benediction</div>
      </div>

      <div class="outline-actions">
        <button class="btn" id="generateAiBtn">Generate with Claude</button>
        <button class="btn subtle" id="copyPromptBtn">Copy Prompt Instead</button>
        <button class="btn subtle" id="insertSynthBtn">Insert into Notes</button>
        <button class="btn subtle" id="startOverOutlineBtn">Start Over</button>
        ${hasKey ? '<button class="btn subtle" id="changeKeyBtn">Change Key</button>' : ''}
      </div>
      <div class="add-status" id="aiGenStatus"></div>

      <div class="outline-source">
        <strong>Source notes used:</strong>
        ${sourceHtml}
      </div>
    `;

    document.getElementById('saveClaudeKeyBtn').addEventListener('click', () => {
      const val = document.getElementById('claudeKeyInput').value.trim();
      if (!val) return;
      setStoredClaudeKey(val);
      document.getElementById('claudeKeyRow').style.display = 'none';
    });
    const changeKeyBtn = document.getElementById('changeKeyBtn');
    if (changeKeyBtn) {
      changeKeyBtn.addEventListener('click', () => {
        document.getElementById('claudeKeyRow').style.display = 'block';
      });
    }
    document.getElementById('generateAiBtn').addEventListener('click', () => generateOutlineWithClaude(src));
    document.getElementById('copyPromptBtn').addEventListener('click', () => copyOutlinePrompt(src));
    document.getElementById('insertSynthBtn').addEventListener('click', insertSynthesizedOutline);
    document.getElementById('startOverOutlineBtn').addEventListener('click', () => {
      outlineSourceState = null;
      try { localStorage.removeItem(OUTLINE_DRAFT_KEY); } catch (e) {}
      renderOutline();
    });
  }

  async function generateOutlineWithClaude(src) {
    const statusEl = document.getElementById('aiGenStatus');
    const key = getStoredClaudeKey();
    if (!key) {
      statusEl.textContent = 'Add your Anthropic API key above first.';
      statusEl.className = 'add-status error';
      document.getElementById('claudeKeyRow').style.display = 'block';
      return;
    }

    statusEl.textContent = 'Generating with Claude...';
    statusEl.className = 'add-status';

    const systemPrompt = 'You are helping a pastor synthesize study notes into a sermon outline. Respond ONLY with valid JSON in exactly this shape, no markdown formatting, no code fences, no commentary before or after: {"thesis": "...", "pointII": "...", "pointIII": "...", "pointIV": "...", "reflectionQuestion": "..."} Each value should be plain text, a sentence or two.';

    const userPrompt = `Passage: ${src.combinedRefs}

Synthesize these study notes into a sermon outline. Write a clear thesis statement, then three points (pointII, pointIII, pointIV) that support and prove that thesis, drawing on the content of the notes below. Also suggest one closing reflection question. Do not write content for Prayer, Example, or Benediction.

Notes:
` + src.sourceNotes.map(n => `--- ${n.reference} (${prettyDateTime(n.dateSaved)}) ---\n${n.text}`).join('\n\n');

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-5',
          max_tokens: 1024,
          system: systemPrompt,
          messages: [{ role: 'user', content: userPrompt }],
        }),
      });

      if (!res.ok) {
        const errBody = await res.text();
        throw new Error(`API returned ${res.status}: ${errBody.slice(0, 200)}`);
      }

      const json = await res.json();
      const rawText = (json.content || []).map(b => b.text || '').join('');
      const cleaned = rawText.trim().replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      const parsed = JSON.parse(cleaned);

      document.getElementById('thesisField').textContent = parsed.thesis || '';
      document.getElementById('pointII').textContent = parsed.pointII || '';
      document.getElementById('pointIII').textContent = parsed.pointIII || '';
      document.getElementById('pointIV').textContent = parsed.pointIV || '';
      document.getElementById('reflectionField').textContent = parsed.reflectionQuestion || '';

      statusEl.textContent = 'Generated — feel free to edit anything above.';
      statusEl.className = 'add-status ok';
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Couldn't generate (${err.message}). Check your API key and connection.`;
      statusEl.className = 'add-status error';
    }
  }

  function copyOutlinePrompt(src) {
    const promptText = `Please synthesize the following sermon notes into an outline using this exact structure. Do not create content for Prayer, Example, or Benediction — leave those as headers only.

I. Introduction
   A. Passage: ${src.combinedRefs}
   B. Prayer:
   C. Example:
   D. Thesis: [write a suggested thesis]

Then create points II, III, and IV in a way that proves the thesis.

V. Conclusion
   A. Closing reflection question
   B. Benediction

Here are my notes to synthesize:

` + src.sourceNotes.map(n => `--- ${n.reference} (${prettyDateTime(n.dateSaved)}) ---\n${n.text}`).join('\n\n');

    const btn = document.getElementById('copyPromptBtn');
    const original = btn.textContent;
    navigator.clipboard.writeText(promptText).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => { if (btn) btn.textContent = original; }, 1800);
    }).catch(() => {
      alert('Could not copy automatically. Here is the prompt:\n\n' + promptText);
    });
  }

  function insertSynthesizedOutline() {
    const thesis = document.getElementById('thesisField').innerHTML;
    const pointII = document.getElementById('pointII').innerHTML;
    const pointIII = document.getElementById('pointIII').innerHTML;
    const pointIV = document.getElementById('pointIV').innerHTML;
    const reflection = document.getElementById('reflectionField').innerHTML;
    const refs = outlineSourceState.combinedRefs;

    const html = `
      <div style="font-weight:700; color:var(--green);">Sermon Outline</div>
      <div><strong>I. Introduction</strong></div>
      <div style="margin-left:20px;">A. Passage: ${escapeHtml(refs)}</div>
      <div style="margin-left:20px;">B. Prayer</div>
      <div style="margin-left:20px;">C. Example</div>
      <div style="margin-left:20px;">D. Thesis: ${thesis}</div>
      <div><strong>II.</strong> ${pointII}</div>
      <div><strong>III.</strong> ${pointIII}</div>
      <div><strong>IV.</strong> ${pointIV}</div>
      <div><strong>V. Conclusion</strong></div>
      <div style="margin-left:20px;">A. Closing reflection question: ${reflection}</div>
      <div style="margin-left:20px;">B. Benediction</div>
      <hr style="margin:14px 0; border:none; border-top:1px dashed rgba(169,120,47,0.35);">
    `;
    editor.innerHTML = html + editor.innerHTML;
    saveDraft();
    document.querySelector('.tab-btn[data-tab="prepare"]').click();
  }

  // ============ Restore draft on load ============
  (function restoreDraft() {
    const draft = loadDraft();
    if (draft && draft.reference) {
      state.reference = draft.reference;
      state.passageHtml = draft.passageHtml;
      state.headings = draft.headings || [];
      state.currentNoteId = draft.currentNoteId || null;
      document.getElementById('passageRef').textContent = draft.reference;
      document.getElementById('passageText').innerHTML = draft.passageHtml || '';
      document.getElementById('notesEditor').innerHTML = draft.editorHtml || '';
      document.getElementById('searchInput').value = draft.reference;
    }
  })();
</script>

</body>
</html>
