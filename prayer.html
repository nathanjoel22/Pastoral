<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer</title>
<style>
  :root {
    --bg: #F6F3EC;
    --bg-line: #E5DFCE;
    --ink: #23261F;
    --ink-soft: #6b6a5f;
    --forest: #2F4A3C;
    --forest-soft: #4A6B57;
    --gold: #B08D3E;
    --gold-bright: #C9A24B;
    --card: #FFFFFF;
    --shadow: rgba(35, 38, 31, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background-color: var(--bg);
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }

  .home-link {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--bg-line);
    color: var(--forest);
    font-size: 16px;
  }
  .home-link:hover { background: var(--bg-line); }

  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }

  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    color: var(--forest);
  }

  .logout-link {
    all: unset;
    cursor: pointer;
    font-size: 11px;
    color: var(--ink-soft);
    display: block;
    margin-top: 10px;
  }
  .logout-link:hover { color: var(--forest); }

  .lords-prayer-card {
    background: var(--card);
    border: 1px solid var(--bg-line);
    border-radius: 8px;
    padding: 30px 36px;
    box-shadow: 0 4px 16px var(--shadow);
    text-align: center;
    max-width: 640px;
    margin: 0 auto 40px;
  }

  .lords-prayer-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--forest);
    margin-bottom: 2px;
  }

  .lords-prayer-ref {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 18px;
  }

  .lords-prayer-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    font-style: italic;
    white-space: pre-wrap;
  }

  .lords-prayer-loading,
  .lords-prayer-error {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .lords-prayer-error { color: var(--forest); }

  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .column-card {
    background: var(--card);
    border: 1px solid var(--bg-line);
    border-radius: 8px;
    padding: 20px 20px 22px;
    box-shadow: 0 4px 16px var(--shadow);
    min-height: 300px;
  }

  .column-title {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--bg-line);
  }

  input[type=text] {
    width: 100%;
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--bg-line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(176,141,62,0.15);
  }
  input[type=text]::placeholder { color: #a39a86; font-style: italic; }

  .prayer-list {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .prayer-item {
    position: relative;
    padding: 10px 22px 10px 4px;
    cursor: pointer;
    border-bottom: 1px dashed var(--bg-line);
  }
  .prayer-item:last-child { border-bottom: none; }
  .prayer-item:hover { background: rgba(176,141,62,0.06); }

  .prayer-line {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }
  .prayer-line::before {
    content: '\2022';
    margin-right: 7px;
    color: var(--gold);
  }
  .prayer-item.answered .prayer-line {
    color: var(--forest);
    font-weight: 600;
  }
  .prayer-item.answered .prayer-line::before {
    color: var(--forest);
  }

  .prayer-date {
    font-size: 10px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 3px;
    margin-left: 15px;
  }
  .prayer-item.answered .prayer-date { color: var(--forest-soft); }

  .prayer-answer-text {
    font-size: 12px;
    color: var(--forest);
    font-style: italic;
    margin-top: 4px;
    margin-left: 15px;
    line-height: 1.4;
  }

  .prayer-remove {
    all: unset;
    position: absolute;
    top: 8px;
    right: 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .prayer-remove:hover { color: #9c3b34; }

  .answer-input-row {
    margin-top: 8px;
    margin-left: 15px;
  }
  .answer-input-row input[type=text] {
    font-size: 12px;
    padding: 6px 8px;
  }

  .empty-col {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 14px 4px;
  }

  @media (max-width: 780px) {
    .columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="appContent" style="display:none;">
<div class="wrap">
  <header>
    <a class="home-link" href="index.html" title="Back to workspace">&#8962;</a>
    <div class="eyebrow">True Vine Community Church</div>
    <h1>Prayer</h1>
    <button class="logout-link" id="logoutBtn">Log out</button>
  </header>

  <div class="lords-prayer-card">
    <div class="lords-prayer-title">The Lord's Prayer</div>
    <div class="lords-prayer-ref">Matthew 6:9&ndash;13</div>
    <div id="lordsPrayerBody">
      <div class="lords-prayer-loading">Loading...</div>
    </div>
  </div>

  <div class="columns">
    <div class="column-card">
      <div class="column-title">New Prayers</div>
      <input type="text" id="newPrayerInput" placeholder="Type a prayer and hit Enter...">
      <div class="prayer-list" id="newPrayerList"></div>
    </div>

    <div class="column-card">
      <div class="column-title">Ongoing Prayers</div>
      <div class="prayer-list" id="ongoingPrayerList"></div>
    </div>

    <div class="column-card">
      <div class="column-title">Answered Prayers</div>
      <div class="prayer-list" id="answeredPrayerList"></div>
    </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://nkfflkrlpulujmgdxxcg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8YxOZr6EHXyHzdtbs68PTg_0B5g1tXz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============ ESV API ============
  const ESV_API_KEY = '46eb88fdca716c9ea434ff3d72f1e5198681154d';
  const ESV_API_URL = 'https://api.esv.org/v3/passage/text/';

  async function fetchLordsPrayer() {
    const params = new URLSearchParams({
      q: 'Matthew 6:9-13',
      'include-verse-numbers': 'false',
      'include-headings': 'false',
      'include-footnotes': 'false',
      'include-short-copyright': 'false',
      'include-passage-references': 'false',
    });
    const res = await fetch(`${ESV_API_URL}?${params.toString()}`, {
      headers: { 'Authorization': `Token ${ESV_API_KEY}` }
    });
    if (!res.ok) throw new Error(`ESV API returned ${res.status}`);
    const json = await res.json();
    return (json.passages || []).join('\n\n').trim();
  }

  async function loadLordsPrayer() {
    const body = document.getElementById('lordsPrayerBody');
    try {
      const text = await fetchLordsPrayer();
      body.innerHTML = `<div class="lords-prayer-text">${escapeHtml(text)}</div>`;
    } catch (err) {
      console.error(err);
      body.innerHTML = `
        <div class="lords-prayer-error">Couldn't load the passage (${escapeHtml(err.message)}).</div>
        <button onclick="loadLordsPrayer()" style="all:unset; cursor:pointer; color:var(--gold); font-size:12px; text-decoration:underline; margin-top:6px; display:inline-block;">Try again</button>
      `;
    }
  }

  // ============ Storage ============
  function rowToPrayer(r) {
    return {
      id: r.id,
      text: r.text,
      status: r.status,
      dateAdded: r.date_added,
      dateAnswered: r.date_answered,
      answerText: r.answer_text,
    };
  }

  async function fetchPrayers() {
    const { data: rows, error } = await sb
      .from('prayers')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) {
      console.error(error);
      alert('Could not load your prayers: ' + error.message);
      return [];
    }
    return (rows || []).map(rowToPrayer);
  }

  async function insertPrayerRemote(text) {
    const { data: inserted, error } = await sb
      .from('prayers')
      .insert({ text, status: 'new', date_added: todayStr() })
      .select()
      .single();
    if (error) {
      console.error(error);
      alert('Could not save that prayer: ' + error.message);
      return null;
    }
    return rowToPrayer(inserted);
  }

  async function updatePrayerStatusRemote(id, status) {
    const { error } = await sb.from('prayers').update({ status }).eq('id', id);
    if (error) { console.error(error); alert('Could not update that: ' + error.message); }
  }

  async function updatePrayerAnswerRemote(id, answerText, dateAnswered) {
    const { error } = await sb.from('prayers').update({ answer_text: answerText, date_answered: dateAnswered }).eq('id', id);
    if (error) { console.error(error); alert('Could not save that: ' + error.message); }
  }

  async function deletePrayerRemote(id) {
    const { error } = await sb.from('prayers').delete().eq('id', id);
    if (error) { console.error(error); alert('Could not delete that: ' + error.message); }
  }

  let data = { prayers: [] };
  let editingAnswerId = null;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function prettyDate(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ============ Prayer actions ============
  async function addPrayer(text) {
    const prayer = await insertPrayerRemote(text);
    if (!prayer) return;
    data.prayers.unshift(prayer);
    renderAll();
  }

  async function movePrayer(id, newStatus) {
    const prayer = data.prayers.find(p => p.id === id);
    if (!prayer) return;
    await updatePrayerStatusRemote(id, newStatus);
    prayer.status = newStatus;
    renderAll();
  }

  async function removePrayer(id) {
    await deletePrayerRemote(id);
    data.prayers = data.prayers.filter(p => p.id !== id);
    if (editingAnswerId === id) editingAnswerId = null;
    renderAll();
  }

  function openAnswerEditor(id) {
    editingAnswerId = id;
    renderAll();
  }

  async function saveAnswer(id, text) {
    const prayer = data.prayers.find(p => p.id === id);
    if (!prayer) return;
    const dateAnswered = todayStr();
    await updatePrayerAnswerRemote(id, text, dateAnswered);
    prayer.answerText = text;
    prayer.dateAnswered = dateAnswered;
    editingAnswerId = null;
    renderAll();
  }

  // ============ Rendering ============
  function renderColumn(containerId, status) {
    const container = document.getElementById(containerId);
    const items = data.prayers.filter(p => p.status === status);

    if (items.length === 0) {
      container.innerHTML = `<div class="empty-col">Nothing here yet.</div>`;
      return;
    }

    container.innerHTML = items.map(p => {
      const isAnswered = status === 'answered';
      const clickHandler = status === 'new'
        ? `movePrayer(${p.id}, 'ongoing')`
        : status === 'ongoing'
          ? `movePrayer(${p.id}, 'answered')`
          : `openAnswerEditor(${p.id})`;

      let extraHtml = '';
      if (isAnswered) {
        if (editingAnswerId === p.id) {
          extraHtml = `
            <div class="answer-input-row" onclick="event.stopPropagation()">
              <input type="text" id="answerInput-${p.id}" placeholder="How did you see this answered?" value="${escapeHtml(p.answerText || '')}">
            </div>
          `;
        } else if (p.answerText) {
          extraHtml = `<div class="prayer-answer-text">${escapeHtml(p.answerText)} &mdash; ${prettyDate(p.dateAnswered)}</div>`;
        }
      }

      return `
        <div class="prayer-item ${isAnswered ? 'answered' : ''}" onclick="${clickHandler}">
          <button class="prayer-remove" onclick="event.stopPropagation(); removePrayer(${p.id})" title="Delete">&times;</button>
          <div class="prayer-line">${escapeHtml(p.text)}</div>
          <div class="prayer-date">${prettyDate(p.dateAdded)}</div>
          ${extraHtml}
        </div>
      `;
    }).join('');

    if (editingAnswerId) {
      const input = document.getElementById(`answerInput-${editingAnswerId}`);
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const text = input.value.trim();
            if (text) saveAnswer(editingAnswerId, text);
          }
        });
      }
    }
  }

  function renderAll() {
    renderColumn('newPrayerList', 'new');
    renderColumn('ongoingPrayerList', 'ongoing');
    renderColumn('answeredPrayerList', 'answered');
  }

  const newPrayerInput = document.getElementById('newPrayerInput');
  newPrayerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = newPrayerInput.value.trim();
      if (!text) return;
      addPrayer(text);
      newPrayerInput.value = '';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  (async function start() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('appContent').style.display = 'block';
    data.prayers = await fetchPrayers();
    renderAll();
    loadLordsPrayer();
  })();
</script>

</body>
</html>
