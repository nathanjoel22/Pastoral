<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer</title>
<style>
  :root {
    --bg: #F6F3EC;
    --bg-line: #E5DFCE;
    --ink: #23261F;
    --ink-soft: #6b6a5f;
    --forest: #2F4A3C;
    --gold: #B08D3E;
    --card: #FFFFFF;
    --shadow: rgba(35, 38, 31, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: linear-gradient(var(--bg-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 90px;
  }

  .wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
  }

  .home-link {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--bg-line);
    color: var(--forest);
    font-size: 16px;
  }
  .home-link:hover { background: var(--bg-line); }

  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }

  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    color: var(--forest);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--bg-line);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 4px 16px var(--shadow);
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="home-link" href="index.html" title="Back to workspace">&#8962;</a>
    <div class="eyebrow">True Vine Community Church</div>
    <h1>Prayer</h1>
  </header>

  <div class="card">This page is ready to be built out — let me know what you'd like here.</div>
</div>

</body>
</html>
